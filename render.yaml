services:
  - type: web
    name: gitype-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.0.0 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @gitype/shared run build &&
      pnpm --filter api exec prisma generate &&
      pnpm --filter api exec prisma migrate deploy &&
      pnpm --filter api run build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
